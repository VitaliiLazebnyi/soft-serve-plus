# Soft Serve Plus Server configurations

# The name of the server.
# This is the name that will be displayed in the UI.
name: "Soft Serve Plus"

# Logging configuration.
log:
  # Log format to use. Valid values are "json", "logfmt", and "text".
  format: "text"
  # Time format for the log "time" field.
  # Should be described in Golang's time format.
  time_format: "2006-01-02 15:04:05"
  # Path to the log file. Leave empty to write to stderr. A relative path
  # is relative to the data directory.
  #path: ""

# The SSH server configuration.
ssh:
  # Enable SSH.
  enabled: true

  # The address on which the SSH server will listen.
  listen_addr: ":23231"

  # The public URL of the SSH server.
  # This is the address that will be used to clone repositories.
  public_url: "ssh://localhost:23231"

  # The path to the SSH server's private key.
  key_path: "ssh/soft_serve_host_ed25519"

  # The path to the server's client private key. This key will be used to
  # authenticate the server to make git requests to ssh remotes.
  client_key_path: "ssh/soft_serve_client_ed25519"

  # How the server's ssh client verifies host keys of ssh remotes it imports
  # or mirrors from, checked against <data_path>/ssh/known_hosts.
  # "accept-new" records a host key on first contact and refuses a changed
  # one (needs OpenSSH 7.6 or newer). "yes" refuses any host that is not
  # already in known_hosts; use it with a pre-seeded known_hosts file. The
  # client always runs with BatchMode=yes, so it fails fast instead of
  # prompting for a passphrase.
  client_strict_host_key_checking: "accept-new"

  # The ssh hosts that repositories may be imported from or mirrored. The
  # client key above is presented to every host a user imports from, so list
  # only hosts you trust that key with. Entries are hostnames, IP addresses,
  # or CIDR ranges, each with an optional port. When the list is empty, only
  # server admins may import from or mirror ssh remotes. Once the list is
  # non-empty it binds admins too: they may then reach only the hosts it
  # names. A mirror is synced with its owner's privileges, so mirroring
  # from ssh needs an owner with the admin flag or a host on this list.
  # CIDR entries are checked against DNS only at import or sync time and ssh
  # resolves the name again, so prefer hostnames for anything you do not
  # control. The list is matched against the name given to ssh; your
  # ssh_config still applies to it.
  client_allowed_hosts: []
    # - "git.internal.example"
    # - "gitlab.corp:2222"
    # - "10.0.0.0/8"

  # The maximum number of seconds a connection can take, whatever it does.
  # The idle timeout is reset by every packet, keepalives included, so this
  # is what bounds a connection that stays busy or keeps a command running,
  # such as a TUI session left open. The default of 6 hours lets a large
  # clone over a slow link finish. A value of 0 means no timeout.
  max_timeout: 21600

  # The number of seconds a connection can be idle before it is closed.
  # A value of 0 means no timeout.
  idle_timeout: 600

  # The maximum number of SSH connections open at once, in total and from
  # one client address (one IPv4 address or one IPv6 /64). Connections over
  # a limit are closed straight away. A connection holds its place from the
  # moment it is accepted until it authenticates, which a client has 2
  # minutes to do. A value of 0 means no limit.
  # Many clients behind one NAT or CI egress address share the per-address
  # limit; raise max_connections_per_ip, or set it to 0, for such setups.
  max_connections: 256
  max_connections_per_ip: 32

  # The signature algorithms the SSH server accepts for client public key
  # authentication. When empty, the server accepts every algorithm
  # golang.org/x/crypto/ssh considers secure, which leaves out the SHA-1 based
  # ssh-rsa and ssh-dss. (The key exchanges, ciphers and MACs are always the
  # ones x/crypto considers secure, without hmac-sha1.) RSA keys still work through rsa-sha2-256 and
  # rsa-sha2-512, which OpenSSH 7.2 and later use. Names x/crypto does not
  # implement are rejected at startup. A list replaces the default, so to let
  # an old client that only signs with ssh-rsa authenticate, copy the default
  # list and append it. Builds with Go 1.27 or later also accept ssh-mldsa-44,
  # ssh-mldsa-65 and ssh-mldsa-87 by default; add those too to keep them:
  #   public_key_auth_algorithms:
  #     - "ssh-ed25519"
  #     - "sk-ssh-ed25519@openssh.com"
  #     - "sk-ecdsa-sha2-nistp256@openssh.com"
  #     - "ecdsa-sha2-nistp256"
  #     - "ecdsa-sha2-nistp384"
  #     - "ecdsa-sha2-nistp521"
  #     - "rsa-sha2-256"
  #     - "rsa-sha2-512"
  #     - "ssh-rsa" # legacy, appended
  public_key_auth_algorithms: []

# The Git daemon configuration.
git:
  # Enable the Git daemon.
  enabled: true

  # The address on which the Git daemon will listen.
  listen_addr: ":9418"

  # The public URL of the Git daemon server.
  # This is the address that will be used to clone repositories.
  public_url: "git://localhost"

  # The maximum number of seconds a connection can take. The idle timeout
  # is reset by every byte, so this is what bounds a client that trickles
  # its request or reads its pack slowly. The default of 6 hours lets a
  # large clone over a slow link finish; git daemon's --timeout bounds only
  # inactivity, like idle_timeout. A value of 0 means no timeout.
  max_timeout: 21600

  # The number of seconds a connection can be idle before it is closed.
  # A value of 0 means no timeout.
  # Independently of it, a client has 10 seconds to send its request.
  # While a pack is prepared, keepalives are sent every idle_timeout/2
  # seconds (at least 1) so that the connection does not go idle.
  idle_timeout: 3

  # The maximum number of concurrent connections, in total (at least 1)
  # and from one client address (one IPv4 address or one IPv6 /64; 0 means
  # no limit). Connections beyond either are refused with "too many
  # connections". Loopback clients (127.0.0.0/8, ::1) have no per-address
  # limit. Behind a TCP proxy that connects from a non-loopback address,
  # such as another host or another container, every client has the
  # proxy's address and shares one address's limit: set
  # max_connections_per_ip to 0 there and limit clients at the proxy. Raise
  # it when many clients share one NAT or CI egress address. The
  # per-address limit keeps one address from taking every connection, not
  # a few addresses together.
  max_connections: 32
  max_connections_per_ip: 8

# The HTTP server configuration.
http:
  # Enable the HTTP server.
  enabled: true

  # The address on which the HTTP server will listen.
  listen_addr: ":23232"

  # The path to the TLS private key.
  tls_key_path: ""

  # The path to the TLS certificate. Set both paths to serve HTTPS, or
  # neither to serve plain HTTP.
  tls_cert_path: ""

  # The public URL of the HTTP server.
  # This is the address that will be used to clone repositories.
  # Make sure to use https:// if you are using TLS.
  public_url: "http://localhost:23232"

  # The maximum number of seconds a request can take. The idle timeout is
  # reset by every byte, so this is what bounds a client that trickles its
  # request or reads the response slowly. The default of 6 hours lets a
  # large clone over a slow link finish; a reverse proxy's timeouts (such as
  # nginx's proxy_read_timeout) usually bound only inactivity, like
  # idle_timeout. A value of 0 means no timeout.
  max_timeout: 21600

  # The number of seconds a request can go without reading from or writing
  # to the client before it is closed. Time the server spends working
  # between reads and writes does not count.
  # A value of 0 means no timeout.
  idle_timeout: 60

  # The maximum number of git and LFS requests served at once, in total and
  # from one client address (one IPv4 address or one IPv6 /64). Requests
  # over a limit get 503 Service Unavailable. A value of 0 means no limit.
  # Loopback clients (127.0.0.0/8, ::1) have no per-address limit, so a
  # reverse proxy on the same host is bound only by max_connections. Behind
  # a reverse proxy that connects from a non-loopback address, such as
  # another host or another container, every client has the proxy's address
  # and shares one address's limit: set max_connections_per_ip to 0 there
  # and limit clients at the proxy. Raise it when many clients share one
  # NAT or CI egress address. The per-address limit keeps one address from
  # taking every request slot, not a few addresses together.
  max_connections: 64
  max_connections_per_ip: 16

  # The cross-origin request security options
  cors:
    # The allowed cross-origin headers
    allowed_headers:
      - "Accept"
      - "Accept-Language"
      - "Content-Language"
      - "Content-Type"
      - "Origin"
      - "X-Requested-With"
      - "User-Agent"
      - "Authorization"
      - "Access-Control-Request-Method"
      - "Access-Control-Allow-Origin"
    # The allowed cross-origin URLs. The public URL is always allowed.
    allowed_origins: []
      # - "https://example.com"
    # The allowed cross-origin methods
    allowed_methods:
      - "GET"
      - "HEAD"
      - "POST"
      - "PUT"
      - "OPTIONS"

# The stats server configuration.
stats:
  # Enable the stats server.
  enabled: true

  # The address on which the stats server will listen. It serves Prometheus
  # metrics at /metrics without authentication, and they name repositories,
  # private ones included, so keep it off untrusted networks.
  listen_addr: "localhost:23233"

# The database configuration.
db:
  # The database driver to use.
  # Valid values are "sqlite" and "postgres".
  driver: "sqlite"
  # The database data source name.
  # This is driver specific and can be a file path or connection string.
  # With SQLite, foreign keys are always enforced (a data source that turns
  # them off is refused), a busy database is waited on for 5 seconds unless
  # the data source sets its own busy_timeout, and the database is in WAL
  # mode unless the data source sets its own journal_mode. On a network file
  # system (NFS, SMB), add "&_pragma=journal_mode(DELETE)" before the first
  # start of a version with WAL as the default: that start switches an
  # existing database to WAL.
  # A relative SQLite path, including the path in a relative "file:" URI, is
  # relative to the data directory. ":memory:" and in-memory "file:" URIs
  # are used as written.
  data_source: "soft-serve.db?_pragma=busy_timeout(5000)&_pragma=foreign_keys(1)"

  # The maximum number of open database connections. 0 means no limit.
  # With Postgres, set it below the server's max_connections (minus what
  # other clients use) so a burst of requests waits for a free connection
  # instead of failing.
  max_open_conns: 0

# Git LFS configuration.
lfs:
  # Enable Git LFS.
  enabled: true
  # Enable Git LFS over SSH (the git-lfs-transfer protocol).
  ssh_enabled: false

# Cron job configuration
jobs:
  # How often pull mirrors sync: a standard five-field cron spec or a
  # descriptor such as "@hourly" or "@every 10m". Set to "" to disable
  # mirror syncing. An empty SOFT_SERVE_JOBS_MIRROR_PULL does not disable
  # it; it keeps this value.
  mirror_pull: "@every 10m"

# Repository webhook configuration.
webhook:
  # Private and internal destinations webhooks may be sent to. Webhooks to
  # loopback, private networks and other internal addresses are refused
  # unless listed here. Entries are hostnames, IP addresses, or CIDR ranges,
  # each with an optional port (a URL without a port uses 80 for http and
  # 443 for https). An IP or CIDR entry allows the addresses it covers,
  # whatever hostname the webhook URL names. A hostname entry allows that
  # name to resolve to loopback, RFC1918, CGNAT or IPv6 unique local
  # addresses, and the name is resolved again for every delivery, so list
  # only names whose DNS you trust. Link-local and cloud metadata addresses
  # (such as 169.254.169.254) are reachable only through an IP or CIDR entry
  # inside their own range; a broad range such as 0.0.0.0/0 does not open
  # them. The list is checked when a webhook is created or updated, and
  # again on every delivery, so existing webhooks follow the current list.
  allowed_hosts: []
    # - "jenkins.internal.example"
    # - "10.0.0.0/8"
    # - "127.0.0.1:8080"

# Additional admin keys. A listed key that no account holds is still a
# server admin over SSH, git transport included, but it can't take LFS locks
# or get an HTTP LFS token (git-lfs-authenticate): both need an account.
# An entry may also be the path to a file in authorized_keys format; a
# relative path is relative to the data directory.
#initial_admin_keys:
#  - "ssh-ed25519 AAAAC3NzaC1lZDI1..."

# Override the anon-access and allow-keyless settings (normally managed at
# runtime with the "settings" command and stored in the database). While
# set, these take precedence over the database on every read, not just on
# first run. This is intended for scripted, non-production bootstrapping
# (e.g. a throwaway server for local dev tooling), not for production use.
# "admin-access" with allow_keyless: true gives anyone who can reach the
# server full admin access. Valid anon_access values are "no-access",
# "read-only", "read-write" and "admin-access".
#anon_access: "read-only"
#allow_keyless: true

# Only server admins (admin accounts or initial_admin_keys) may create
# repositories. Registered non-admins and anonymous users cannot create or
# import. Renaming counts as creating the new name, so repository owners and
# admin-access collaborators can no longer rename their repositories.
# Anonymous access to a name that does not exist yet is capped at read-only
# whatever anon_access says. Access to existing repositories is not affected.
# Defaults to false.
#admin_only_create: false

# Maximum number of repositories each user may create (repo create, repo
# import and push-to-create). Server admins are exempt, and repositories
# created without an account all count together as one user. A user at the
# limit is refused; existing repositories are kept. Imports still running
# count against the limit. 0 means no limit.
#max_repos_per_user: 0

# Make repositories created without an explicit visibility private:
# push-to-create over SSH and HTTP, repo create and repo import without
# --private, and default_repo. "repo create --private=false" still creates a
# public repository. An anonymous user could not access a private
# repository (it would be owned by the default admin), so when this is set
# anonymous push-to-create is refused, and anonymous repo create and repo
# import need --private=false. Defaults to false (such repositories are
# public).
#default_private: false

# Name of a repository to create automatically on boot if it doesn't already
# exist. Empty disables this behavior.
#default_repo: ""
