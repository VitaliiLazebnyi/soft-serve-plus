# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

project_name: soft-serve-plus


metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"

before:
  hooks:
    # Fail on an untidy go.mod or go.sum instead of changing them mid-release.
    - go mod tidy -diff
    - rm -rf completions
    - mkdir completions
    - rm -rf manpages
    - mkdir manpages
    - sh -c 'go run ./cmd/soft completion "bash" >./completions/soft.bash'
    - sh -c 'go run ./cmd/soft completion "zsh" >./completions/soft.zsh'
    - sh -c 'go run ./cmd/soft completion "fish" >./completions/soft.fish'
    # Dated by the commit, and gzip -n leaves the build time out of the header.
    - sh -c 'SOURCE_DATE_EPOCH={{ .CommitTimestamp }} go run ./cmd/soft man | gzip -cn >./manpages/soft.1.gz'
    # nfpm dates the apk's scripts by their files, not by mtime below.
    - touch -d "{{ .CommitDate }}" .nfpm/postinstall.sh .nfpm/preremove.sh .nfpm/postremove.sh

builds:
  - binary: "soft"
    main: "./cmd/soft"
    env:
      - CGO_ENABLED=0
    # Reproducible: no checkout or module-cache paths in the binary, and the
    # file dated by the commit rather than by the build.
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags: -s -w -X main.Version=v{{ .Version }} -X main.CommitSHA={{ .Commit }}
    goos:
      - linux
      - darwin
      - windows
      - freebsd
    goarch:
      - amd64
      - arm64
      - "386"
      - arm
    goarm:
      - "7"
    ignore:
      - goos: windows
        goarch: arm64
      - goos: windows
        goarch: "386"
      - goos: windows
        goarm: "7"
      - goos: freebsd
        goarch: "386"
      - goos: freebsd
        goarch: arm

# The archives and packages are what checksums.txt lists and the provenance
# attests, so they are reproducible too: every entry is dated by the commit and
# has a fixed owner and mode, whatever the checkout's times, umask and user.
archives:
  - builds_info:
      owner: root
      group: root
      mtime: "{{ .CommitDate }}"
    format_overrides:
      - goos: windows
        formats: zip
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    wrap_in_directory: true
    files:
      - src: README*
        info: &archive_file
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: LICENSE*
        info: *archive_file
      - src: manpages/*
        info: *archive_file
      - src: completions/*
        info: *archive_file

nfpms:
  - vendor: "Soft Serve Plus"
    homepage: "https://github.com/VitaliiLazebnyi/soft-serve-plus"
    maintainer: "Vitalii Lazebnyi <18521734+VitaliiLazebnyi@users.noreply.github.com>"
    description: "A tasty, self-hostable Git server for the command line🍦 (maintained fork of Soft Serve)"
    license: MIT
    file_name_template: "{{ .ConventionalFileName }}"
    # Dates the binary and the package metadata; each entry in contents
    # carries its own mtime.
    mtime: "{{ .CommitDate }}"
    formats:
      - apk
      - deb
      - rpm
    # Both packages install /usr/bin/soft and the soft-serve systemd unit.
    conflicts:
      - soft-serve
    replaces:
      - soft-serve
    contents:
      - src: ./completions/soft.bash
        dst: /etc/bash_completion.d/soft
        file_info: &package_file
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: ./completions/soft.fish
        dst: /usr/share/fish/vendor_completions.d/soft.fish
        file_info: *package_file
      - src: ./completions/soft.zsh
        dst: /usr/share/zsh/site-functions/_soft
        file_info: *package_file
      - src: ./manpages/soft.1.gz
        dst: /usr/share/man/man1/soft.1.gz
        file_info: *package_file
      - src: ./.nfpm/soft-serve.service
        dst: /usr/lib/systemd/system/soft-serve.service
        file_info: *package_file
      - src: ./.nfpm/soft-serve.conf
        dst: /etc/soft-serve.conf
        type: config|noreplace
        # systemd reads the environment file as root; it may hold secrets.
        file_info:
          mode: 0600
          mtime: "{{ .CommitDate }}"
      - src: ./.nfpm/sysusers.conf
        dst: /usr/lib/sysusers.d/soft-serve.conf
        file_info: *package_file
      - src: ./.nfpm/tmpfiles.conf
        dst: /usr/lib/tmpfiles.d/soft-serve.conf
        file_info: *package_file
    scripts:
      postinstall: ./.nfpm/postinstall.sh
      preremove: ./.nfpm/preremove.sh
      postremove: ./.nfpm/postremove.sh
    apk:
      scripts:
        # apk runs postinstall only on first install; run it on upgrade too so
        # the service is restarted with the new binary.
        postupgrade: ./.nfpm/postinstall.sh
    dependencies:
      - git
    # git runs ssh to mirror repositories over ssh:// URLs.
    recommends:
      - openssh-client
    overrides:
      rpm:
        recommends:
          - openssh-clients

checksum:
  name_template: "checksums.txt"

source:
  enabled: true

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^test:"
      - "^chore"
      - "merge conflict"
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch
      - go mod tidy

dockers_v2:
  - dockerfile: Dockerfile
    images:
      - ghcr.io/vitaliilazebnyi/soft-serve-plus
    tags:
      - "v{{ .Version }}"
      - "{{ if not .Prerelease }}v{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
      - linux/arm/v7
    # Reproducible: BuildKit dates the image config and history by
    # SOURCE_DATE_EPOCH, and rewrite-timestamp clamps the times of the files
    # the RUN steps write to it. buildx's own provenance attestation records
    # the build time, so it is left out of the index; the release workflow
    # attests the image with actions/attest-build-provenance instead.
    # GoReleaser adds --push (or --load for a snapshot), which buildx applies
    # to this image output. A rebuild matches as long as Alpine serves the
    # same package versions: `apk add` installs the newest ones.
    build_args:
      SOURCE_DATE_EPOCH: "{{ .CommitTimestamp }}"
    flags:
      - --output=type=image,rewrite-timestamp=true
      - --provenance=false
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "A tasty, self-hostable Git server for the command line (maintained fork of Soft Serve)"
      org.opencontainers.image.source: "https://github.com/VitaliiLazebnyi/soft-serve-plus"
      org.opencontainers.image.version: "v{{ .Version }}"
      # The commit date, not the build time, so a rebuilt image has the same labels.
      org.opencontainers.image.created: "{{ .CommitDate }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: MIT

git:
  tag_sort: semver

release:
  prerelease: auto
