name: lint

on:
  push:
    branches:
      - "main"
  pull_request:

# A new push to a pull request cancels the run for its previous push. Other
# runs (pushes to main) get a group of their own, so they are never cancelled
# or held back as pending.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# golangci-lint-action needs only contents: read; GitHub makes the
# annotations from its output, through setup-go's problem matcher.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --config=.golangci.yml --timeout=10m ./...
      # Again with the webhooktest build tag, for the files only the
      # testscript harness builds (cmd/soft/serve, pkg/webhook). It runs
      # even when the first run fails, so both report their findings.
      - name: golangci-lint (webhooktest tag)
        if: ${{ !cancelled() }}
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --config=.golangci.yml --timeout=10m --build-tags=webhooktest ./...
