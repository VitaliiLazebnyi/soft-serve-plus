name: coverage

on:
  push:
    branches:
      - "main"
  pull_request:

# A new push to a pull request cancels the run for its previous push. Other
# runs (pushes to main) get a group of their own, so they are never cancelled
# or held back as pending.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:
    # One entry on purpose: Postgres runs as a service container, which only
    # Linux runners have, and macOS and Windows already run the suite in
    # build.yml. The matrix stays so the job keeps the name
    # "coverage (ubuntu-latest)" that the main ruleset requires.
    strategy:
      matrix:
        os: [ubuntu-latest]
    services:
      postgres:
        # Pinned by digest so a new Postgres release cannot change CI
        # behind our back; bump both the tag and the digest together.
        image: postgres:18@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # The Postgres service above. The steps that run on Postgres set
      # SOFT_SERVE_DB_DRIVER=postgres and use this as the data source; the
      # others leave the driver unset and run on SQLite.
      POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
      # The packages whose tests open their database with internal/dbtest
      # and so run on Postgres when SOFT_SERVE_DB_DRIVER=postgres. Every
      # other package's tests ignore the variable, so running them again on
      # Postgres would only repeat the SQLite run.
      POSTGRES_PACKAGES: >-
        ./pkg/backend
        ./pkg/daemon
        ./pkg/db/...
        ./pkg/ssh/...
        ./pkg/store/...
        ./pkg/ui
        ./internal/dbtest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Coverage comes from two sources: the unit tests, and the soft binary
      # the end-to-end scripts (./testscript) build with -cover and run.
      #
      # https://go.dev/testing/coverage/
      # https://dustinspecker.com/posts/go-combined-unit-integration-code-coverage/
      # https://github.com/golang/go/issues/51430#issuecomment-1344711300
      - name: Unit tests (SQLite)
        run: |
          mkdir -p coverage/unit
          go test -failfast -race -timeout 5m -skip=^TestScript -cover ./... -args -test.gocoverdir="$PWD/coverage/unit"

      - name: Unit tests (Postgres)
        env:
          SOFT_SERVE_DB_DRIVER: postgres
        run: |
          mkdir -p coverage/unit-postgres
          # POSTGRES_PACKAGES is a list of patterns: split it into words.
          # -timeout only bounds a hang: these packages take about a minute
          # with -race locally, and a slow runner must not trip it.
          # shellcheck disable=SC2086
          SOFT_SERVE_DB_DATA_SOURCE="$POSTGRES_DSN" \
            go test -failfast -race -timeout 10m -cover $POSTGRES_PACKAGES -args -test.gocoverdir="$PWD/coverage/unit-postgres"

      # The -timeout also covers the -race build of cmd/soft, which
      # TestScript does on first use.
      - name: Scripts (SQLite)
        run: |
          mkdir -p coverage/int
          GOCOVERDIR="$PWD/coverage/int" go test -failfast -race -timeout 5m -run=^TestScript ./testscript

      - name: Scripts (Postgres)
        env:
          SOFT_SERVE_DB_DRIVER: postgres
        run: |
          mkdir -p coverage/int-postgres
          SOFT_SERVE_DB_DATA_SOURCE="$POSTGRES_DSN" \
            GOCOVERDIR="$PWD/coverage/int-postgres" go test -failfast -race -timeout 5m -run=^TestScript ./testscript

      - name: Merge coverage
        # Converted to the legacy text format that Codecov reads.
        run: go tool covdata textfmt -i=coverage/unit,coverage/unit-postgres,coverage/int,coverage/int-postgres -o=coverage.txt

      # Uploads need the CODECOV_TOKEN repository secret. Without it (fork
      # pull requests, or before the secret is set) the upload is tokenless
      # and may be rejected, so it only fails the job once the token exists.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.txt
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}
