version: 2

# Every ecosystem waits a week before proposing a new version, so a release
# that is pulled or found compromised within days never reaches a pull
# request. Security updates are not delayed by the cooldown.
#
# Not covered here, so bumped by hand: the golangci-lint and GoReleaser
# versions given to their actions (lint.yml, build.yml, goreleaser.yml) and
# the Postgres service image (coverage.yml). Dependabot reads only `uses:`
# lines in workflows and only Dockerfiles for images.

updates:
  - package-ecosystem: "gomod"
    # The module, and the tools CI and Taskfile.yaml run with `go tool
    # -modfile=.github/tools/go.mod` (govulncheck, svu).
    directories:
      - "/"
      - "/.github/tools"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      all:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      all:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      all:
        patterns:
          - "*"
