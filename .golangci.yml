version: "2"
linters:
  enable:
    - bodyclose
    # - exhaustive
    # - goconst
    # - godot
    # - godox
    # - gomoddirectives
    - goprintffuncname
    - gosec
    - misspell
    # - nakedret
    # - nestif
    # - nilerr
    - noctx
    - nolintlint
    # - prealloc
    # - revive
    - rowserrcheck
    - sqlclosecheck
    - tparallel
    # - unconvert
    # - unparam
    - whitespace
    # - wrapcheck
  settings:
    gosec:
      excludes:
        # Unchecked errors: errcheck is on and reports them, with its own
        # exclusions and nolint comments; G104 would report each one again.
        - G104
    staticcheck:
      checks:
        # golangci-lint's defaults.
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # Naming the embedded field is often clearer than relying on promotion.
        - -QF1008
  exclusions:
    generated: lax
    presets:
      # This preset also hides gosec's G103, G204 and G304. The 15 findings
      # it hides outside test files were reviewed as false positives: git
      # run with argument lists, the operator's custom hook, paths the
      # operator configures or the server owns, and, in the test helpers
      # git/gittest/count.go and gittest.go, a test's own git and log file.
      - common-false-positives
    rules:
      - text: '(slog|log)\.\w+'
        linters:
          - noctx
      # Test code: it runs commands built from test constants, writes
      # fixtures under t.TempDir with whatever modes the case needs, carries
      # fake credentials and test-only host-key callbacks, and never runs in
      # a server. gosec's findings there are all of those kinds.
      - path: _test\.go
        linters:
          - gosec
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofumpt
    - goimports
  exclusions:
    generated: lax
